<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Dinhdang.css">
    <title>Toàn bộ lịch sử giao dịch</title>
</head>
<body style="padding: 20px 0;">

    <div class="container">
        <div class="history-header" style="margin-bottom: 25px;">
            <h2><i class="fa-solid fa-receipt"></i> Toàn Bộ Lịch Sử Giao Dịch</h2>
            <a href="index.html" class="btn-submit" style="width: auto; margin-top: 0; padding: 8px 18px;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại Dashboard
            </a>
        </div>

        <div id="full-history-container" class="section-card">
            <p style="color: var(--text-muted);">Đang tải dữ liệu từ Cloud Firebase...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBjEgSWjNFH2UvYkV4qQWb-oEDJ1RSoahI",
          authDomain: "quanlytien-25a9a.firebaseapp.com",
          projectId: "quanlytien-25a9a",
          storageBucket: "quanlytien-25a9a.firebasestorage.app",
          messagingSenderId: "1031835235629",
          appId: "1:1031835235629:web:b7ef833c98a8e2d4294fa4",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('full-history-container');

        async function loadFullHistory() {
            try {
                const docRef = doc(db, "finances", "data");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const historyArr = data.history || [];

                    if (historyArr.length === 0) {
                        container.innerHTML = '<p style="color: var(--text-muted);">Chưa có giao dịch nào được ghi nhận.</p>';
                        return;
                    }

                    let html = '<div class="history-list">';
                    historyArr.forEach((item, index) => {
                        html += `<div class="history-item">
                                    <span><b>#${index + 1}</b> &nbsp; ${item}</span>
                                 </div>`;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="color: var(--text-muted);">Không tìm thấy dữ liệu.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #f87171;">Lỗi khi tải dữ liệu từ hệ thống!</p>';
                console.error(error);
            }
        }

        loadFullHistory();
    </script>
</body>
</html>
